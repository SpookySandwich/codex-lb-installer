name: Build and Release Codex-LB Installer

on:
  schedule:
    - cron: '0 */6 * * *' # Run every 6 hours
  push:
    branches:
      - main
  workflow_dispatch: # Enable manual triggers

permissions:
  contents: write

jobs:
  check-and-build:
    name: Check for New Releases and Build
    runs-on: windows-latest

    steps:
      - name: Checkout Our Repository
        uses: actions/checkout@v4

      - name: Check for New Target Releases
        id: check
        shell: python
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          import urllib.request
          import json
          import os
          import sys
          import time

          my_repo = os.getenv("GITHUB_REPOSITORY")
          token = os.getenv("GITHUB_TOKEN")

          # Authenticate every GitHub API call. Unauthenticated requests share a
          # 60/hour limit per runner IP, which intermittently 403s the upstream
          # release check; an authenticated token (valid against public repos
          # too) raises this to 5000/hour and makes the check reliable.
          api_headers = {"User-Agent": "Mozilla/5.0"}
          if token:
              api_headers["Authorization"] = f"token {token}"

          # Fetch ALL upstream releases (not just /latest, to handle pre-releases properly)
          # Retry transient failures (rate limits, blips) with a short backoff.
          upstream_releases = None
          for attempt in range(1, 6):
              try:
                  req = urllib.request.Request(
                      "https://api.github.com/repos/Soju06/codex-lb/releases?per_page=20",
                      headers=api_headers
                  )
                  with urllib.request.urlopen(req) as response:
                      upstream_releases = json.loads(response.read().decode())
                  break
              except Exception as e:
                  print(f"Attempt {attempt}/5 - error fetching upstream releases: {e}")
                  if attempt == 5:
                      print("Giving up after 5 attempts.")
                      sys.exit(1)
                  time.sleep(2 ** attempt)

          if not upstream_releases:
              print("No upstream releases found.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("build_needed=false\n")
              sys.exit(0)

          print(f"Upstream releases found: {len(upstream_releases)}")
          for r in upstream_releases:
              pre = "[PRE-RELEASE]" if r.get("prerelease") else "[STABLE]"
              print(f"  {pre} {r['tag_name']}")

          # Fetch our existing release tags
          try:
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{my_repo}/releases?per_page=50",
                  headers=api_headers
              )
              with urllib.request.urlopen(req) as response:
                  our_releases = json.loads(response.read().decode())
                  our_tags = {r["tag_name"] for r in our_releases}
          except Exception as e:
              print(f"Error fetching our releases: {e}")
              our_tags = set()

          print(f"Our existing tags: {sorted(our_tags)}")

          # Identify the newest STABLE (non-prerelease) upstream release. This
          # is the version that should always be tracked and marked as "latest".
          # Upstream releases are returned newest-first by GitHub.
          newest_stable_tag = None
          for rel in upstream_releases:
              if not rel.get("prerelease"):
                  newest_stable_tag = rel["tag_name"]
                  break

          # Always expose the newest stable tag so the self-heal step below can
          # keep the "latest" badge correct even on runs where nothing is built.
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"newest_stable_tag={newest_stable_tag or ''}\n")

          # Decide what to build this run:
          #   1. Prefer the newest stable release if we haven't built it yet, so
          #      the latest stable release always syncs promptly and is never
          #      masked by a more recent pre-release.
          #   2. Otherwise fall back to the most recent release (including
          #      pre-releases) we haven't built yet.
          target_tag = None
          target_prerelease = False
          if newest_stable_tag is not None and newest_stable_tag not in our_tags:
              target_tag = newest_stable_tag
              target_prerelease = False
          else:
              for rel in upstream_releases:
                  if rel["tag_name"] not in our_tags:
                      target_tag = rel["tag_name"]
                      target_prerelease = bool(rel.get("prerelease"))
                      break

          if target_tag is None:
              print("All upstream releases already built. Nothing to do.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("build_needed=false\n")
          else:
              # Only the newest stable release should be flagged as "latest";
              # pre-releases and older stable backfills must not claim it.
              make_latest = (not target_prerelease) and (target_tag == newest_stable_tag)
              label = "pre-release" if target_prerelease else "stable release"
              print(f"New {label} detected: {target_tag}. Building installer...")
              print(f"Mark as latest release: {make_latest}")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("build_needed=true\n")
                  f.write(f"tag_name={target_tag}\n")
                  f.write(f"prerelease={str(target_prerelease).lower()}\n")
                  f.write(f"make_latest={str(make_latest).lower()}\n")

      - name: Clone Target Repository at Tag
        if: steps.check.outputs.build_needed == 'true'
        shell: bash
        run: |
          rm -rf codex-lb-src
          git clone --depth 1 --branch ${{ steps.check.outputs.tag_name }} https://github.com/Soju06/codex-lb.git codex-lb-src

      - name: Setup Go compiler
        if: steps.check.outputs.build_needed == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Setup Node.js
        if: steps.check.outputs.build_needed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        if: steps.check.outputs.build_needed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup uv
        if: steps.check.outputs.build_needed == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Patch frontend for recharts type compatibility
        if: steps.check.outputs.build_needed == 'true'
        shell: python
        run: |
          """Fix recharts PieSectorDataItem type change — v3.8+ removed `id`
          from the callback parameter; use `data.payload` instead."""
          import pathlib

          fp = pathlib.Path("codex-lb-src/frontend/src/components/donut-chart.tsx")
          content = fp.read_text()

          # The buggy pattern: onMouseEnter callback accesses data.id directly
          # Replace with data.payload access (as done in codex-lb v1.18.2+).
          old = (
              "onMouseEnter={(data) => {\n"
              "                  if (typeof data?.id === \"string\") {\n"
              "                    setActiveLegendId(data.id);\n"
              "                  }\n"
              "                }}"
          )
          new = (
              "onMouseEnter={(data) => {\n"
              "                  const datum = (data?.payload as DonutDatum | undefined);\n"
              "                  if (typeof datum?.id === \"string\") {\n"
              "                    setActiveLegendId(datum.id);\n"
              "                  }\n"
              "                }}"
          )

          if old in content:
              content = content.replace(old, new)
              fp.write_text(content)
              print("Patched donut-chart.tsx: data.id -> data.payload")
          else:
              print("donut-chart.tsx already patched or pattern not found — skipping.")

      - name: Install build tools (Pillow, rsrc)
        if: steps.check.outputs.build_needed == 'true'
        shell: bash
        run: |
          pip install Pillow
          go install github.com/akavel/rsrc@latest

      - name: Build Frontend Assets
        if: steps.check.outputs.build_needed == 'true'
        shell: bash
        run: |
          cd codex-lb-src/frontend
          npm install
          npm run build

      - name: Build and Package Installer
        if: steps.check.outputs.build_needed == 'true'
        shell: pwsh
        run: |
          python bundle_build.py

      - name: Create Release and Upload Asset
        if: steps.check.outputs.build_needed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check.outputs.tag_name }}
          name: Release ${{ steps.check.outputs.tag_name }}
          prerelease: ${{ steps.check.outputs.prerelease }}
          make_latest: ${{ steps.check.outputs.make_latest }}
          body: |
            Automated Windows installer package for Codex Load Balancer version `${{ steps.check.outputs.tag_name }}`.

            Double-click the installer to install. Launching the program will start Codex Load Balancer silently in the background and pop up the dashboard in your default browser.
          files: dist/CodexLB_Installer_*.exe
          token: ${{ secrets.GITHUB_TOKEN }}

      # Self-heal the "latest" badge on every run, regardless of whether a new
      # build happened. GitHub does not always re-point "latest" to the newest
      # stable release on its own (e.g. when releases are built out of
      # chronological order), so we explicitly re-assert it here. This is a
      # cheap, idempotent reconciliation: if the badge is already correct it is
      # a no-op.
      - name: Ensure newest stable release is marked latest
        if: always() && steps.check.outputs.newest_stable_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEWEST_STABLE: ${{ steps.check.outputs.newest_stable_tag }}
        run: |
          set -euo pipefail

          # Only reconcile if we actually have a build for the newest stable tag.
          if ! gh release view "$NEWEST_STABLE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "No release for $NEWEST_STABLE yet; skipping latest reconciliation."
            exit 0
          fi

          current_latest=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 \
            --json tagName,isLatest --jq 'map(select(.isLatest)) | .[0].tagName // ""')

          if [ "$current_latest" = "$NEWEST_STABLE" ]; then
            echo "Latest badge already on $NEWEST_STABLE; nothing to do."
          else
            echo "Re-pointing latest badge from '${current_latest:-<none>}' to $NEWEST_STABLE."
            gh release edit "$NEWEST_STABLE" --repo "$GITHUB_REPOSITORY" \
              --latest --prerelease=false
          fi
